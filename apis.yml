name: Jain Irrigation Systems Ltd
description: >-
  Jain Irrigation Systems Ltd (JISL) is a global agri-industrial conglomerate
  headquartered in Jalgaon, Maharashtra, India, and is widely cited as the
  world's largest micro-irrigation company. Founded in 1963 by Padma Shri
  recipient Bhavarlal Jain under the slogan "More Crop Per Drop," the company
  manufactures drip and sprinkler irrigation systems, PVC/HDPE/PP and plumbing
  piping, rigid and foam plastic sheets, solar pumping and photovoltaic systems,
  tissue-culture planting material, greenhouses and protected cultivation, and
  processed foods. JISL operates 33 manufacturing bases across four continents,
  serves 126+ countries through 11,000+ dealers, is listed on the BSE and NSE,
  and reports turnover exceeding USD 1.2 billion. The company publishes a
  structured llms.txt for AI crawlers but exposes no public developer API.
